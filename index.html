<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Rock Paper Scissors</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="shell">
        <section class="hero">
            <p class="eyebrow">LAN multiplayer</p>
            <h1>Rock Paper Scissors</h1>
            <p class="subtitle">Create a room, share the code, and play on any device on the same network.</p>
        </section>

        <section id="lobby" class="panel lobby">
            <div class="field-row">
                <label for="playerName">Your name</label>
                <input id="playerName" type="text" maxlength="20" placeholder="Enter your name">
            </div>

            <div class="actions">
                <button class="primary" id="createButton" type="button">Create room</button>
                <div class="divider"><span>or join with a code</span></div>
                <div class="join-row">
                    <input id="roomCodeInput" type="text" maxlength="6" placeholder="ABC123">
                    <button class="secondary" id="joinButton" type="button">Join room</button>
                </div>
            </div>

            <p id="lobbyMessage" class="message"></p>
        </section>

        <section id="game" class="panel game hidden">
            <div class="topbar">
                <div>
                    <p class="label">Room code</p>
                    <h2 id="roomCodeDisplay">------</h2>
                </div>
                <button class="ghost" id="copyButton" type="button">Copy code</button>
            </div>

            <div class="scoreboard">
                <article class="player-card me">
                    <p class="label">You</p>
                    <h3 id="meName">Player</h3>
                    <strong id="meScore">0</strong>
                </article>
                <div class="versus">VS</div>
                <article class="player-card rival">
                    <p class="label">Opponent</p>
                    <h3 id="opponentName">Waiting...</h3>
                    <strong id="opponentScore">0</strong>
                </article>
            </div>

            <div class="status-panel">
                <p class="label">Status</p>
                <p id="statusText">Waiting for a second player...</p>
            </div>

            <div id="choicesSection" class="choices-section">
                <button class="move" data-choice="rock" type="button">✊<span>Rock</span></button>
                <button class="move" data-choice="paper" type="button">✋<span>Paper</span></button>
                <button class="move" data-choice="scissors" type="button">✌️<span>Scissors</span></button>
            </div>

            <div id="resultPanel" class="result-panel hidden">
                <h3 id="resultTitle">Round result</h3>
                <p id="resultMoves"></p>
                <button class="primary" id="nextRoundButton" type="button">Next round</button>
            </div>

            <button class="ghost wide" id="resetButton" type="button">Reset score</button>
        </section>
    </main>

    <script>
        const state = {
            socket: null,
            roomCode: "",
            playerId: "",
            playerName: "",
        };

        const els = {
            lobby: document.getElementById("lobby"),
            game: document.getElementById("game"),
            lobbyMessage: document.getElementById("lobbyMessage"),
            playerName: document.getElementById("playerName"),
            roomCodeInput: document.getElementById("roomCodeInput"),
            roomCodeDisplay: document.getElementById("roomCodeDisplay"),
            meName: document.getElementById("meName"),
            opponentName: document.getElementById("opponentName"),
            meScore: document.getElementById("meScore"),
            opponentScore: document.getElementById("opponentScore"),
            statusText: document.getElementById("statusText"),
            choicesSection: document.getElementById("choicesSection"),
            resultPanel: document.getElementById("resultPanel"),
            resultTitle: document.getElementById("resultTitle"),
            resultMoves: document.getElementById("resultMoves"),
        };

        document.getElementById("createButton").addEventListener("click", createRoom);
        document.getElementById("joinButton").addEventListener("click", joinRoom);
        document.getElementById("copyButton").addEventListener("click", copyRoomCode);
        document.getElementById("nextRoundButton").addEventListener("click", showChoices);
        document.getElementById("resetButton").addEventListener("click", resetGame);
        document.querySelectorAll(".move").forEach((button) => {
            button.addEventListener("click", () => makeChoice(button.dataset.choice));
        });
        els.roomCodeInput.addEventListener("input", () => {
            els.roomCodeInput.value = els.roomCodeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
        });

        function setLobbyMessage(message) {
            els.lobbyMessage.textContent = message;
        }

        function setStatus(message) {
            els.statusText.textContent = message;
        }

        function getPlayerName() {
            const name = els.playerName.value.trim();
            if (!name) {
                setLobbyMessage("Enter your name to continue.");
                els.playerName.focus();
                return null;
            }
            return name.slice(0, 20);
        }

        async function createRoom() {
            const playerName = getPlayerName();
            if (!playerName) {
                return;
            }

            try {
                const response = await fetch("/api/create-room", { method: "POST" });
                const data = await response.json();
                state.playerName = playerName;
                state.playerId = "player1";
                state.roomCode = data.room_code;
                connect();
            } catch {
                setLobbyMessage("Could not create the room.");
            }
        }

        async function joinRoom() {
            const playerName = getPlayerName();
            if (!playerName) {
                return;
            }

            const roomCode = els.roomCodeInput.value.trim().toUpperCase();
            if (roomCode.length !== 6) {
                setLobbyMessage("Enter a valid 6-character room code.");
                return;
            }

            try {
                const response = await fetch(`/api/room/${roomCode}`);
                const data = await response.json();
                if (!data.exists) {
                    setLobbyMessage("Room not found.");
                    return;
                }
                if (data.full) {
                    setLobbyMessage("That room already has two players.");
                    return;
                }

                state.playerName = playerName;
                state.playerId = "player2";
                state.roomCode = roomCode;
                connect();
            } catch {
                setLobbyMessage("Could not join the room.");
            }
        }

        function connect() {
            const scheme = location.protocol === "https:" ? "wss" : "ws";
            state.socket = new WebSocket(`${scheme}://${location.host}/ws/${state.roomCode}/${state.playerId}`);

            state.socket.addEventListener("open", () => {
                state.socket.send(JSON.stringify({ type: "join", name: state.playerName }));
                els.lobby.classList.add("hidden");
                els.game.classList.remove("hidden");
                els.roomCodeDisplay.textContent = state.roomCode;
                els.meName.textContent = state.playerName;
                setStatus("Connected. Waiting for the other player...");
            });

            state.socket.addEventListener("message", (event) => {
                const payload = JSON.parse(event.data);
                handleMessage(payload);
            });

            state.socket.addEventListener("close", () => {
                if (!els.lobby.classList.contains("hidden")) {
                    return;
                }
                setStatus("Connection closed.");
                disableChoices(true);
            });

            state.socket.addEventListener("error", () => {
                setStatus("Connection error.");
            });
        }

        function handleMessage(payload) {
            switch (payload.type) {
                case "connected":
                case "players":
                    updatePlayers(payload.players || {});
                    updateScores(payload.scores || { player1: 0, player2: 0 });
                    break;
                case "choice_made":
                    setStatus(payload.player === state.playerId ? "Move locked. Waiting for opponent..." : "Opponent has made a move.");
                    break;
                case "result":
                    showResult(payload);
                    break;
                case "reset":
                    updateScores(payload.scores || { player1: 0, player2: 0 });
                    showChoices();
                    setStatus("Scores reset. Pick a move.");
                    break;
                case "player_disconnected":
                    setStatus("Opponent disconnected.");
                    disableChoices(true);
                    break;
                case "error":
                    setLobbyMessage(payload.message || "Unexpected error.");
                    break;
            }
        }

        function updatePlayers(players) {
            const me = players[state.playerId];
            const opponent = players[state.playerId === "player1" ? "player2" : "player1"];
            els.meName.textContent = me ? me.name : state.playerName;
            els.opponentName.textContent = opponent ? opponent.name : "Waiting...";
            disableChoices(!players.player1 || !players.player2);
            setStatus(players.player1 && players.player2 ? "Both players connected. Choose your move." : "Waiting for the other player...");
        }

        function updateScores(scores) {
            if (state.playerId === "player1") {
                els.meScore.textContent = scores.player1;
                els.opponentScore.textContent = scores.player2;
                return;
            }
            els.meScore.textContent = scores.player2;
            els.opponentScore.textContent = scores.player1;
        }

        function disableChoices(disabled) {
            document.querySelectorAll(".move").forEach((button) => {
                button.disabled = disabled;
            });
        }

        function makeChoice(choice) {
            if (!state.socket || state.socket.readyState !== WebSocket.OPEN) {
                return;
            }
            state.socket.send(JSON.stringify({ type: "choice", choice }));
            disableChoices(true);
            setStatus("Move locked. Waiting for opponent...");
        }

        function showResult(payload) {
            const myChoice = state.playerId === "player1" ? payload.player1_choice : payload.player2_choice;
            const opponentChoice = state.playerId === "player1" ? payload.player2_choice : payload.player1_choice;
            const didWin = payload.winner === state.playerId;
            const title = payload.winner === "draw" ? "Draw" : didWin ? "You win" : "You lose";

            updateScores(payload.scores);
            els.resultTitle.textContent = `${title} · Round ${payload.round}`;
            els.resultMoves.textContent = `${formatChoice(myChoice)} vs ${formatChoice(opponentChoice)}`;
            els.choicesSection.classList.add("hidden");
            els.resultPanel.classList.remove("hidden");
            setStatus("Round complete. Start the next round when both players are ready.");
        }

        function showChoices() {
            els.resultPanel.classList.add("hidden");
            els.choicesSection.classList.remove("hidden");
            if (els.opponentName.textContent !== "Waiting...") {
                disableChoices(false);
                setStatus("Choose your move.");
            }
        }

        function resetGame() {
            if (!state.socket || state.socket.readyState !== WebSocket.OPEN) {
                return;
            }
            state.socket.send(JSON.stringify({ type: "reset" }));
        }

        async function copyRoomCode() {
            try {
                await navigator.clipboard.writeText(state.roomCode);
                setStatus(`Copied room code ${state.roomCode}.`);
            } catch {
                setStatus(`Room code: ${state.roomCode}`);
            }
        }

        function formatChoice(choice) {
            const map = {
                rock: "Rock ✊",
                paper: "Paper ✋",
                scissors: "Scissors ✌️",
            };
            return map[choice] || choice;
        }
    </script>
</body>
</html>
